receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
    metric_expiration: 180m
    enable_open_metrics: true
    
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

  # Lutum addition: log events (tool calls, decisions, hooks) go to Loki
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # Lutum addition: traces (one waterfall per session) go to Tempo, and Grafana shows them
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
      
  extensions: []
  
  telemetry:
    logs:
      level: "debug"